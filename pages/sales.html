<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NIC Industries · Sales</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="https://www.nicindustries.com/images/made-in-usa.svg">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#0a0a0a;--bg2:#0a0a0a;--bg3:#141414;--bg4:#1c1c1e;
  --card:#141414;--card-hover:#1c1c1e;
  --border:#262626;--border2:#3a3a3a;
  --text:#fafafa;--text2:#d4d4d4;--muted:#a3a3a3;--dim:#737373;
  --accent:#ff9800;--accent-light:rgba(255,152,0,0.12);--accent-mid:rgba(255,152,0,0.28);--accent-dark:#cc7a00;
  --green:#10b981;--green-bg:rgba(16,185,129,0.12);--green-border:rgba(16,185,129,0.35);
  --amber:#facc15;--amber-bg:rgba(250,204,21,0.12);--amber-border:rgba(250,204,21,0.35);
  --red:#ef4444;--red-bg:rgba(239,68,68,0.12);--red-border:rgba(239,68,68,0.35);
  --ink:#fafafa;
  --shadow-sm:0 1px 2px rgba(0,0,0,0.4);
  --shadow:0 1px 3px rgba(0,0,0,0.5),0 1px 2px rgba(0,0,0,0.3);
  --shadow-md:0 4px 6px rgba(0,0,0,0.4),0 2px 4px rgba(0,0,0,0.3);
  --radius:8px;--radius-lg:12px;
  --font-display:'Outfit','Inter',system-ui,sans-serif;
  --font-body:'Inter','Outfit',system-ui,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;background:var(--bg);}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:13px;line-height:1.5;min-height:100vh;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;}
.mono{font-family:var(--font-mono);font-size:0.92em;font-variant-numeric:tabular-nums;}

/* Header */
.header{background:var(--bg);border-bottom:1px solid var(--border);padding:0 32px;display:flex;align-items:stretch;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:var(--shadow-sm);border-top:3px solid var(--accent);}
.header-left{display:flex;align-items:center;gap:20px;padding:14px 0;}
.brand-logo{display:flex;align-items:center;height:36px;}
.brand-logo svg{height:32px;width:auto;display:block;}
.divider-v{width:1px;height:24px;background:var(--border);}
.header-meta{display:flex;flex-direction:column;gap:1px;}
.header-meta .lbl{font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;font-family:var(--font-mono);}
.header-meta .val{font-family:var(--font-mono);font-size:11px;color:var(--text2);font-weight:500;}
.header-right{display:flex;align-items:center;gap:8px;padding:14px 0;}

/* Badges */
.badge{padding:3px 8px;border-radius:4px;font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;font-family:var(--font-mono);}
.badge-info{background:var(--accent-light);color:var(--accent);border:1px solid var(--accent-mid);}

/* Nav bars */
.nav-row{display:flex;background:var(--bg);border-bottom:1px solid var(--border);}
.mkt-bar{padding:0 32px;display:flex;align-items:stretch;gap:0;flex:1;overflow-x:auto;}
.mkt-tab{padding:10px 16px;font-family:var(--font-mono);font-size:11px;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer;transition:all 0.15s;user-select:none;white-space:nowrap;display:flex;align-items:center;gap:6px;font-weight:500;}
.mkt-tab:hover{color:var(--text2);border-bottom-color:var(--border2);}
.mkt-tab.active{color:var(--accent);border-bottom-color:var(--accent);}
.mkt-tab .cur{font-size:8px;color:var(--dim);font-weight:400;}
.mkt-tab.active .cur{color:var(--accent);opacity:0.6;}

/* Week selector */
.week-ctrl{display:flex;align-items:center;gap:0;background:var(--bg);border-bottom:1px solid var(--border);padding:6px 32px;}
.week-nav{padding:6px 12px;font-family:var(--font-mono);font-size:11px;color:var(--muted);cursor:pointer;border:none;background:none;transition:color 0.15s;font-weight:500;}
.week-nav:hover{color:var(--text);}
.week-nav:disabled{opacity:0.3;cursor:default;}
.week-select{background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:5px 10px;font-family:var(--font-mono);font-size:11px;cursor:pointer;min-width:140px;}
.week-select:focus{outline:none;border-color:var(--accent);}
.week-range{display:flex;align-items:center;gap:8px;margin-left:20px;padding-left:20px;border-left:1px solid var(--border);}
.week-range-label{font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:0.8px;font-family:var(--font-mono);}
.week-range-sel{background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:5px 8px;font-family:var(--font-mono);font-size:10px;cursor:pointer;}
.week-range-sel:focus{outline:none;border-color:var(--accent);}
.compare-badge{padding:2px 6px;border-radius:4px;font-size:8px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;font-family:var(--font-mono);background:var(--accent-light);color:var(--accent);border:1px solid var(--accent-mid);margin-left:8px;}

/* Trend bar */
.trend-bar{background:var(--bg);border-bottom:1px solid var(--border);padding:9px 32px;display:flex;align-items:center;gap:24px;overflow-x:auto;}
.trend-item{display:flex;align-items:center;gap:7px;white-space:nowrap;}
.trend-lbl{font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:0.8px;font-family:var(--font-mono);}
.trend-v{font-family:var(--font-mono);font-size:12px;font-weight:600;color:var(--text);}
.trend-delta{font-size:9px;font-family:var(--font-mono);padding:1px 5px;border-radius:3px;font-weight:500;}
.up-bad{color:var(--red);background:var(--red-bg);}
.up-good{color:var(--green);background:var(--green-bg);}
.down-bad{color:var(--red);background:var(--red-bg);}
.down-good{color:var(--green);background:var(--green-bg);}
.neutral{color:var(--dim);background:var(--bg3);}
.trend-div{width:1px;height:18px;background:var(--border);}

/* Layout */
.page{padding:24px 32px;max-width:1600px;margin:0 auto;}
.sec{font-family:var(--font-display);font-size:11px;text-transform:uppercase;letter-spacing:1.8px;color:var(--text2);margin-bottom:10px;font-weight:700;display:flex;align-items:center;gap:10px;}
.sec::before{content:'';display:inline-block;width:3px;height:12px;background:var(--accent);border-radius:1px;}

/* Division ribbon (footer) */
.brand-ribbon{background:var(--bg);border-top:1px solid var(--border);padding:14px 32px;display:flex;align-items:center;justify-content:center;gap:36px;flex-wrap:wrap;}
.brand-ribbon .rib-lbl{font-family:var(--font-mono);font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:1.4px;font-weight:500;}
.brand-ribbon a{display:inline-flex;align-items:center;opacity:0.55;transition:opacity 0.2s ease;filter:grayscale(0.15);}
.brand-ribbon a:hover{opacity:1;filter:grayscale(0);}
.brand-ribbon img{height:22px;width:auto;display:block;}
.brand-ribbon .rib-div{width:1px;height:18px;background:var(--border);}

/* KPI row */
.kpi-row{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;margin-bottom:24px;background:var(--border);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow);}
.kpi{background:var(--card);padding:14px 16px;position:relative;}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;}
.kpi.ok::before{background:var(--green);}.kpi.warn::before{background:var(--amber);}.kpi.crit::before{background:var(--red);}.kpi.neutral::before{background:var(--accent);}
.kpi-lbl{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;font-family:var(--font-mono);font-weight:600;}
.kpi-val{font-family:var(--font-display);font-size:24px;font-weight:700;color:var(--ink);line-height:1;margin-bottom:3px;letter-spacing:-0.3px;font-variant-numeric:tabular-nums;}
.kpi-val.crit{color:var(--red);}.kpi-val.warn{color:var(--amber);}.kpi-val.ok{color:var(--green);}
.kpi-sub{font-size:9px;color:var(--dim);font-family:var(--font-mono);}

/* Panels & Charts */
.three-col{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:24px;}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px;}
.panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow-sm);}
.panel-header{padding:10px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:var(--bg2);}
.panel-title{font-size:10px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);font-family:var(--font-mono);font-weight:600;}
.panel-body{padding:16px;}
.chart-wrap canvas{max-height:200px;}
.chart-wrap.tall canvas{max-height:230px;}

/* Marketplace cards */
.mkt-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:1px;background:var(--border);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;margin-bottom:24px;box-shadow:var(--shadow);}
.mc{background:var(--card);padding:14px 16px;cursor:pointer;transition:background 0.15s;position:relative;}
.mc:hover{background:var(--card-hover);}
.mc-name{font-family:var(--font-display);font-weight:700;font-size:13px;color:var(--ink);margin-bottom:4px;display:flex;align-items:center;gap:8px;letter-spacing:-0.1px;}
.mc-name .mc-cur{font-size:9px;color:var(--dim);font-family:var(--font-mono);font-weight:400;}
.mc-rev{font-family:var(--font-display);font-size:24px;font-weight:700;color:var(--ink);margin-bottom:8px;letter-spacing:-0.4px;font-variant-numeric:tabular-nums;}
.mc-row{display:flex;justify-content:space-between;margin-bottom:2px;}
.mc-l{font-size:9px;color:var(--muted);font-family:var(--font-mono);font-weight:500;}
.mc-v{font-family:var(--font-mono);font-size:11px;color:var(--text);font-weight:500;}
.mc-v.crit{color:var(--red);}.mc-v.warn{color:var(--amber);}.mc-v.ok{color:var(--green);}
.mc-pct{position:absolute;top:14px;right:16px;font-family:var(--font-mono);font-size:9px;color:var(--dim);font-weight:500;}

/* Product grid */
.product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:1px;background:var(--border);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;margin-bottom:24px;box-shadow:var(--shadow);}
.pc{background:var(--card);padding:12px 14px;position:relative;transition:background 0.15s;}
.pc:hover{background:var(--card-hover);}
.pc-bar{position:absolute;top:0;left:0;right:0;height:2px;background:var(--border2);}
.pc-name{font-family:var(--font-display);font-weight:700;font-size:12px;color:var(--ink);margin-bottom:8px;margin-top:4px;letter-spacing:-0.1px;}
.pc-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:3px;}
.pcl{font-size:9px;color:var(--muted);font-family:var(--font-mono);font-weight:500;}
.pcv{font-family:var(--font-mono);font-size:11px;color:var(--text);font-weight:600;}
.pcv.crit{color:var(--red);}.pcv.warn{color:var(--amber);}.pcv.ok{color:var(--green);}
.eff-wrap{margin-top:8px;}
.eff-lbl{display:flex;justify-content:space-between;margin-bottom:3px;}
.eff-track{height:3px;background:var(--bg3);border-radius:2px;position:relative;overflow:hidden;}
.eff-fill{height:100%;border-radius:2px;width:0%;transition:width 0.7s ease;}
.eff-thresh{position:absolute;top:-3px;width:1px;height:9px;background:var(--border2);}

/* Filter bar */
.filter-bar{display:flex;align-items:center;gap:20px;background:var(--bg);border-bottom:1px solid var(--border);padding:7px 32px;}
.filter-group{display:flex;align-items:center;gap:4px;}
.filter-label{font-size:8px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;font-family:var(--font-mono);margin-right:6px;font-weight:600;}
.filter-btn{padding:4px 12px;border-radius:5px;font-size:10px;font-weight:600;font-family:var(--font-mono);letter-spacing:0.5px;color:var(--muted);background:transparent;border:1px solid var(--border);cursor:pointer;transition:all 0.15s;}
.filter-btn:hover{color:var(--text2);border-color:var(--border2);}
.filter-btn.active{color:var(--accent);background:var(--accent-light);border-color:var(--accent-mid);}

@keyframes fadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
.ani{animation:fadeIn 0.25s ease both;}

footer{border-top:1px solid var(--border);padding:12px 32px;display:flex;justify-content:space-between;align-items:center;color:var(--dim);font-size:9px;font-family:var(--font-mono);background:var(--bg);}

@media(max-width:1100px){.kpi-row{grid-template-columns:repeat(4,1fr);}}
@media(max-width:700px){.kpi-row{grid-template-columns:repeat(2,1fr);}.three-col{grid-template-columns:1fr;}}

/* v4 layout: period header, KPI deltas, data tables (replaces mkt/product cards) */
.trend-bar{display:none;}
.period-head{margin:2px 0 16px;}
.period-head h1{font-family:var(--font-display);font-weight:600;font-size:22px;letter-spacing:-0.3px;}
.period-head h1 span{color:var(--muted);font-weight:500;}
.period-head .sub{font-family:var(--font-mono);font-size:10px;color:var(--dim);margin-top:3px;}
.kpi-sub .sub-lbl{color:var(--dim);margin-left:6px;}
.tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow);margin-bottom:24px;}
table.dt{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;background:var(--card);}
table.dt th{font-family:var(--font-mono);font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);text-align:right;padding:9px 10px;border-bottom:1px solid var(--border);white-space:nowrap;font-weight:600;background:var(--bg2);}
table.dt th:first-child,table.dt td:first-child{text-align:left;}
table.dt td{padding:8px 10px;border-bottom:1px solid var(--border);text-align:right;font-family:var(--font-mono);font-size:11.5px;color:var(--text2);white-space:nowrap;}
table.dt tr:last-child td{border-bottom:none;}
table.dt td:first-child{font-family:var(--font-body);font-size:12.5px;color:var(--text);font-weight:500;}
table.dt tr.clickable{cursor:pointer;}
table.dt tr.clickable:hover td{background:var(--card-hover);}
table.dt td .sub{display:block;font-size:9px;color:var(--dim);font-weight:400;font-family:var(--font-mono);white-space:normal;}
.pill{display:inline-block;padding:1px 6px;border-radius:3px;font-size:10px;font-weight:600;}
.pill.ok{background:var(--green-bg);color:var(--green);}.pill.warn{background:var(--amber-bg);color:var(--amber);}.pill.crit{background:var(--red-bg);color:var(--red);}
.d{font-family:var(--font-mono);font-size:10px;font-weight:600;white-space:nowrap;}
.d.up-good,.d.down-good{color:var(--green);}.d.up-bad,.d.down-bad{color:var(--red);}.d.neutral{color:var(--dim);}

/* ---- budget pacing ---- */
.pace-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:10px;}
.pace-head .sec{margin-bottom:0;}
.pace-meta{font-family:var(--font-mono);font-size:10px;color:var(--dim);}
.pace-sel{background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:3px 8px;font-family:var(--font-mono);font-size:10px;}
.pace-bar{position:relative;display:inline-block;width:110px;height:6px;background:var(--bg4);border-radius:3px;vertical-align:middle;margin-left:8px;overflow:visible;}
.pace-bar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;}
.pace-bar b{position:absolute;left:calc(100% / 1.3);top:-3px;bottom:-3px;width:1px;background:var(--text2);}
.pace-ok i{background:var(--green)}.pace-warn i{background:var(--amber)}.pace-crit i{background:var(--red)}
.pace-pct{font-weight:600;min-width:52px;display:inline-block;text-align:right;}
.pace-ok .pace-pct{color:var(--green)}.pace-warn .pace-pct{color:var(--amber)}.pace-crit .pace-pct{color:var(--red)}
.pace-none{color:var(--dim);font-style:normal;}
table.dt tr.pace-total td{border-top:1px solid var(--border2);color:var(--text);font-weight:600;background:var(--bg3);}
.oos-chip{display:inline-block;margin:3px 0 0;padding:1px 6px;border-radius:3px;font-family:var(--font-mono);font-size:9px;font-weight:600;color:var(--red);background:var(--red-bg);border:1px solid var(--red-border);text-decoration:none;white-space:nowrap;}
td:first-child .oos-chip{display:table;}
.oos-chip.var{color:var(--amber);background:var(--amber-bg);border-color:var(--amber-border);}
.sec-sub{font-family:var(--font-mono);font-size:9px;letter-spacing:0.3px;text-transform:none;color:var(--dim);font-weight:500;}
.sec-sub a{color:var(--accent);}
.prelim{display:inline-block;margin-top:8px;padding:4px 10px;border-radius:5px;font-family:var(--font-mono);font-size:10px;color:var(--amber);background:var(--amber-bg);border:1px solid var(--amber-border);}
.data-notes{list-style:none;margin:0 0 24px;padding:12px 16px;border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--card);font-family:var(--font-mono);font-size:10.5px;color:var(--muted);line-height:1.7;}
.data-notes li::before{content:'\2022';color:var(--accent);margin-right:8px;}
.kpi-row.wk-kpi{grid-template-columns:repeat(4,1fr);}
@media(max-width:700px){.kpi-row.wk-kpi{grid-template-columns:repeat(2,1fr);}}
.wk-st{display:inline-block;padding:1px 6px;border-radius:3px;font-family:var(--font-mono);font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;border:1px solid var(--border);color:var(--muted);}
.wk-st.current{color:var(--accent);border-color:var(--accent-mid);background:var(--accent-light);}
.wk-st.provisional{color:var(--amber);border-color:var(--amber-border);background:var(--amber-bg);}
table.dt tr.wk-now td{background:var(--bg3);}
.wk-neg{color:var(--red);}.wk-pos{color:var(--green);}
.pace-note{font-family:var(--font-mono);font-size:10px;color:var(--dim);margin:-16px 0 24px;line-height:1.6;}
</style>
</head>
<body>

<script>
// ═══════════════════════════════════════════════════════════════
// DATA — injected by scripts/build.py from data/weeks/*.json
// ═══════════════════════════════════════════════════════════════

var MKT_META = /*__MKT_META__*/;
var WEEKS = /*__WEEKS__*/;
var MKT_KEYS = /*__MKT_KEYS__*/;
var FX = /*__FX__*/;
var NTB_MKTS = /*__NTB_MKTS__*/;  // markets whose ads report new-to-brand at all
var PACING = /*__PACING__*/;
var WEEKLY = /*__WEEKLY__*/;  // Cerakote Auto rolling 6-week budget (scripts/weekly.py)
var PERIODS = /*__PERIODS__*/;  // exact calendar-month totals by 'YYYY-MM' (NIC normalize.py --period)
var STOCK = /*__STOCK__*/;      // out-of-stock now, per tab, from the latest Q4 inventory projection
var CHANGES = /*__CHANGES__*/;  // ad changes logged in Scale Insights: weekly counts + budget changes  // [{month:'YYYY-MM', budgets:{tab:n}, spend:{tab:{spend,source}}, through:'YYYY-MM-DD'}] oldest first  // units of currency per 1 USD, by ISO code; MKT_META[k].code picks the rate
var FX_MODE = 'USD';   // GLOBAL view is FX-normalised to USD
var MKT_COLORS = {CC_US:"#4fc3f7",CC_CA:"#4ade80",CC_UK:"#a78bfa",CC_FR:"#fbbf24",CC_DE:"#2dd4bf",CC_IT:"#fb923c",CC_ES:"#f472b6",CC_NL:"#94a3b8",CC_MX:"#c084fc",CC_AUS:"#ef4444",CC_SA:"#eab308",CL_US:"#f59e0b",PP_US:"#34d399"};




// ═══════════════════════════════════════════════════════════════
// CONSTANTS
// ═══════════════════════════════════════════════════════════════
const PC_COLORS = ['#ff9800','#10b981','#60a5fa','#22d3ee','#a78bfa','#ef4444','#2dd4bf','#d946ef','#fb923c','#818cf8','#a3a3a3'];

const fC = (n,cur) => {const s=cur||'$'; return n>=1e6?s+(n/1e6).toFixed(2)+'M':n>=1000?s+(n/1000).toFixed(1)+'K':s+n.toFixed(0);};
const fCF = (n,cur) => (cur||'$')+n.toLocaleString(undefined,{maximumFractionDigits:0});
const fP = n => n.toFixed(1)+'%';
const fX = n => n.toFixed(1)+'x';
const fN = n => n>=1000?(n/1000).toFixed(1)+'K':String(Math.round(n||0));

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function getCur(mk){return MKT_META[mk]?.currency||'$';}

const EU_MKTS=['CC_FR','CC_DE','CC_IT','CC_ES','CC_NL'];
function filterMkts(ks){
  if(brandFilter==='CC') return ks.filter(k=>k.startsWith('CC_'));
  if(brandFilter==='EU') return ks.filter(k=>EU_MKTS.indexOf(k)!==-1);
  return ks;
}

// ---- FX: every GLOBAL figure is converted to USD before summing (v3.9 fix 3)
function fxRate(mk){const code=(MKT_META[mk]||{}).code||'USD';return FX[code]||1;}
function toUSD(mk,v){return (v||0)/fxRate(mk);}
const SUM_KEYS=['revenue','units','orders','sessions','pageviews','adSpend','adSales','organicSales','ntbOrders','ntbSales'];
const MONEY_KEYS={revenue:1,adSpend:1,adSales:1,organicSales:1,ntbSales:1};
function deriveAcct(t){
  t.cvr=t.sessions?((t.units/t.sessions)*100):0;
  t.acos=t.adSales?(t.adSpend/t.adSales*100):0;
  t.tacos=t.revenue?(t.adSpend/t.revenue*100):0;
  t.roas=t.adSpend?(t.adSales/t.adSpend):0;
  t.ntbPct=t.orders>0?((t.ntbOrders/t.orders)*100):0;  // ad-attributed NTB orders / all orders
  return t;
}
function emptyAcct(){const t={};SUM_KEYS.forEach(k=>t[k]=0);return t;}
function hasData(a){return !!(a&&(a.revenue>0||a.adSpend>0||a.units>0));}
function getGlobalAcct(w){
  const ms=w.markets, ks=filterMkts(Object.keys(ms));
  const t=emptyAcct();
  ks.forEach(k=>{const a=ms[k].acct;if(!a)return;SUM_KEYS.forEach(p=>{t[p]+=MONEY_KEYS[p]?toUSD(k,a[p]):(a[p]||0);});});
  return deriveAcct(t);
}

// ---- Calendar helpers. A week belongs to the month that holds its Thursday (ISO rule); MONTH prorates boundary weeks by day (v3.9 fixes 1, 2, 5)
function weSunday(w){
  if(w.we) return new Date(w.we+'T00:00:00Z');
  const m=(w.fullLabel||'').match(/([A-Za-z]+)\s+(\d+),\s+(\d{4})/);
  const months={January:0,February:1,March:2,April:3,May:4,June:5,July:6,August:7,September:8,October:9,November:10,December:11};
  return m?new Date(Date.UTC(+m[3],months[m[1]],+m[2])):new Date();
}
function weekMonth(w){const th=new Date(weSunday(w));th.setUTCDate(th.getUTCDate()-3);return {y:th.getUTCFullYear(),m:th.getUTCMonth()};}
function daysInMonthOfWeek(w,y,m){ // how many of the week's 7 days fall in month y/m
  const sun=weSunday(w);let n=0;
  for(let i=6;i>=0;i--){const d=new Date(sun);d.setUTCDate(sun.getUTCDate()-i);if(d.getUTCFullYear()===y&&d.getUTCMonth()===m)n++;}
  return n;
}
function scaleMarkets(w,frac){ // proportional slice of a week's markets (all additive metrics)
  const out={};
  Object.keys(w.markets).forEach(k=>{const m=w.markets[k];const a={};SUM_KEYS.forEach(p=>a[p]=(m.acct[p]||0)*frac);
    out[k]={acct:deriveAcct(a),products:(m.products||[]).map(p=>{const q=Object.assign({},p);['revenue','units','orders','sessions','pageviews','adSpend','adSales','organic','ntbOrders','ntbSales'].forEach(x=>q[x]=(p[x]||0)*frac);return q;}),flags:[],source:m.source,ntbLoaded:m.ntbLoaded!==false};});
  return out;
}
function mergeMarkets(list){ // list of {markets} slices -> one summed markets object, products summed by name
  const out={};
  list.forEach(ms=>Object.keys(ms).forEach(k=>{
    if(!out[k])out[k]={acct:emptyAcct(),products:[],flags:[],_p:{},_ntbOk:0,_ntbMiss:0};
    const o=out[k],a=ms[k].acct;if(ms[k].ntbLoaded===false)o._ntbMiss++;else o._ntbOk++;SUM_KEYS.forEach(p=>o.acct[p]+=(a[p]||0));
    (ms[k].products||[]).forEach(p=>{
      if(!o._p[p.name])o._p[p.name]={name:p.name,revenue:0,units:0,orders:0,sessions:0,pageviews:0,adSpend:0,adSales:0,organic:0,ntbOrders:0,ntbSales:0,bsr:p.bsr,subcategory:p.subcategory,subcategoryBSR:p.subcategoryBSR,categoryBSR:p.categoryBSR};
      const t=o._p[p.name];['revenue','units','orders','sessions','pageviews','adSpend','adSales','organic','ntbOrders','ntbSales'].forEach(x=>t[x]+=(p[x]||0));
      t.bsr=p.bsr;t.subcategory=p.subcategory;t.subcategoryBSR=p.subcategoryBSR;t.categoryBSR=p.categoryBSR; // latest week wins (list is newest first)
    });
  }));
  Object.keys(out).forEach(k=>{const o=out[k];deriveAcct(o.acct);o.ntbLoaded=o._ntbOk>0;o.ntbPartial=o._ntbOk>0&&o._ntbMiss>0;delete o._ntbOk;delete o._ntbMiss;
    o.products=Object.values(o._p).map(p=>{p.cvr=p.sessions?((p.units/p.sessions)*100):0;p.acos=p.adSales?(p.adSpend/p.adSales*100):0;p.tacos=p.revenue?(p.adSpend/p.revenue*100):0;p.roas=p.adSpend?(p.adSales/p.adSpend):0;p.ntbPct=p.orders?((p.ntbOrders/p.orders)*100):0;p.status=(p.acos>30||p.tacos>15)?'crit':p.tacos>10?'warn':'ok';return p;});
    delete o._p;});
  return out;
}
const MONTH_NAMES=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function monthSlice(y,m,uptoWeekIdx,uptoDay){ // sum of prorated weeks of month y/m; uptoWeekIdx limits to weeks at or before that index (newest first); uptoDay limits days
  const parts=[];let days=0;
  WEEKS.forEach((w,i)=>{
    if(uptoWeekIdx!==null&&i<uptoWeekIdx)return;
    const n=daysInMonthOfWeek(w,y,m);if(!n)return;
    let frac=n/7;
    if(uptoDay){ // count only days <= uptoDay
      const sun=weSunday(w);let c=0;for(let j=6;j>=0;j--){const d=new Date(sun);d.setUTCDate(sun.getUTCDate()-j);if(d.getUTCFullYear()===y&&d.getUTCMonth()===m&&d.getUTCDate()<=uptoDay)c++;}
      frac=c/7;if(!c)return;days+=c;
    } else days+=n;
    parts.push(scaleMarkets(w,frac));
  });
  return {markets:mergeMarkets(parts),days:days,weeks:parts.length};
}
function getMonthView(){ // calendar month holding the selected week. Exact date-range totals when PERIODS has the month, else weeks split by day
  if(!WEEKS.length)return WEEKS[0];
  const sel=WEEKS[wIdx],ym=weekMonth(sel);
  const dim=new Date(Date.UTC(ym.y,ym.m+1,0)).getUTCDate();
  const py=ym.m===0?ym.y-1:ym.y,pm=ym.m===0?11:ym.m-1;
  const key=ym.y+'-'+String(ym.m+1).padStart(2,'0'), pkey=py+'-'+String(pm+1).padStart(2,'0');
  const X=PERIODS&&PERIODS[key];
  if(X){
    const XP=PERIODS[pkey];let prev,range;
    if(XP&&X.complete&&XP.complete){prev=XP.markets;range='vs '+MONTH_NAMES[pm];}
    else if(XP&&XP.complete){prev=scaleMarkets({markets:XP.markets},X.days/XP.days);range='vs '+MONTH_NAMES[pm]+' at the same daily rate ('+X.days+' of '+XP.days+' days)';}
    else{prev=monthSlice(py,pm,null,X.days).markets;range='vs '+MONTH_NAMES[pm]+' 1-'+X.days+' (est.)';}
    return {label:MONTH_NAMES[ym.m]+' '+ym.y+(X.complete?'':' MTD'),fullLabel:'Calendar month: '+X.fullLabel+(X.complete?'':' ('+X.days+' of '+dim+' days)')+' · exact totals',range:range,markets:X.markets,_prev:prev,_partial:!X.complete,_exact:true};
  }
  const latest=weSunday(WEEKS[0]);const complete=latest>=new Date(Date.UTC(ym.y,ym.m,dim));
  const cur=monthSlice(ym.y,ym.m,null,null);
  const prevS=complete?monthSlice(py,pm,null,null):monthSlice(py,pm,null,cur.days);
  return {label:MONTH_NAMES[ym.m]+' '+ym.y+(complete?'':' PARTIAL'),fullLabel:'Calendar month: '+MONTH_NAMES[ym.m]+' '+ym.y+(complete?'':' (PARTIAL, '+cur.days+' of '+dim+' days loaded)')+' · weeks that span two months are split by day (estimate)',range:'vs '+MONTH_NAMES[pm]+(complete?'':' 1-'+cur.days),markets:cur.markets,_prev:prevS.markets,_partial:!complete};
}
function getActiveWeek(){return viewMode==='MONTH'?getMonthView():WEEKS[wIdx];}
function getPriorAcct(w,mk){ // comparison basis for the trend bar
  if(w._prev){const pw={markets:w._prev};return getMktData(pw,mk).acct;}
  const cmpSel=document.getElementById('weekCompare');
  if(cmpSel&&cmpSel.value==='prev'&&wIdx<WEEKS.length-1) return getMktData(WEEKS[wIdx+1],mk).acct;
  if(cmpSel&&cmpSel.value!=='prev') return getMktData(WEEKS[parseInt(cmpSel.value)],mk).acct;
  return null;
}


// NTB state: 'na' = market's ads do not report NTB; 'pending' = Reports Beta file not loaded yet (Monday build); 'partial' = some weeks/markets missing
function ntbState(w,mk){
  if(mk==='GLOBAL'){
    const ks=filterMkts(Object.keys(w.markets)).filter(k=>NTB_MKTS.indexOf(k)!==-1);
    if(!ks.length)return 'na';
    const miss=ks.filter(k=>w.markets[k].ntbLoaded===false).length, part=ks.some(k=>w.markets[k].ntbPartial);
    return miss===ks.length?'pending':(miss||part)?'partial':'ok';
  }
  if(NTB_MKTS.indexOf(mk)===-1)return 'na';
  const m=w.markets[mk]; if(!m)return 'na';
  return m.ntbLoaded===false?'pending':m.ntbPartial?'partial':'ok';
}
function ntbCell(st,txt){
  if(st==='na')return '<span class="pace-none" title="Amazon does not report new-to-brand for this market\'s ad types">n/a</span>';
  if(st==='pending')return '<span class="pace-none" title="Loads Thursday from the Reports Beta file">pending</span>';
  return txt+(st==='partial'?'<span class="pace-none" title="Some weeks or markets not loaded yet">*</span>':'');
}
// ---- stock: what the Inventory page says is out right now. Shown only on views that include the current week
function stockNow(){if(!STOCK||!STOCK.tabs)return false;if(viewMode==='WEEKLY')return wIdx===0;return weekMonth(WEEKS[wIdx]).m===weekMonth(WEEKS[0]).m&&weekMonth(WEEKS[wIdx]).y===weekMonth(WEEKS[0]).y;}
function stockTab(t){return stockNow()?(STOCK.tabs[t]||null):null;}
function fDay(s){if(!s)return '?';const p=s.split('-');return MONTH_NAMES[+p[1]-1]+' '+(+p[2]);}
function oosChip(t){const s=stockTab(t);if(!s||!s.out)return '';
  return `<a class="oos-chip" href="../inventory/" onclick="event.stopPropagation()" title="Out of stock now, per the Inventory page (${esc(STOCK.week)})">${s.out} out${s.lost_usd?' · $'+fN(s.lost_usd)+' lost':''}</a>`;}
function oosProduct(t,name){const s=stockTab(t);if(!s)return null;const l=s.items.filter(i=>i.product===name);return l.find(i=>i.main)||l[0]||null;}
function getMktData(w,mk){
  if(mk==='GLOBAL') return {acct:getGlobalAcct(w),products:[],flags:[]};
  return w.markets[mk]||{acct:{revenue:0,units:0,sessions:0,pageviews:0,adSpend:0,adSales:0,organicSales:0,acos:0,tacos:0,roas:0,ntbOrders:0,ntbSales:0,ntbPct:0,cvr:0},products:[],flags:[]};
}

function delta(val,prev,higherIsBad,pp){
  if(prev===undefined||prev===null||prev===0)return '<span class="trend-delta neutral">—</span>';
  const d=val-prev;
  if(Math.abs(d)<0.01)return '<span class="trend-delta neutral">0'+(pp?' pp':'%')+'</span>';
  const a=pp?Math.abs(d).toFixed(1)+' pp':Math.abs((d/prev)*100).toFixed(1)+'%';
  const cls=higherIsBad?(d>0?'up-bad':'down-good'):(d>0?'up-good':'down-bad');
  return `<span class="trend-delta ${cls}">${d>0?'▲':'▼'} ${a}</span>`;
}

// v4: compact delta chip for KPI tiles and table cells
function dd(val,prev,rate,bad){
  if(prev===undefined||prev===null||(!rate&&prev===0))return '<span class="d neutral">—</span>';
  const d=val-prev;
  if(Math.abs(d)<(rate?0.05:0.005))return '<span class="d neutral">0</span>';
  const cls=bad?(d>0?'up-bad':'down-good'):(d>0?'up-good':'down-bad');
  const txt=rate?(d>0?'+':'')+d.toFixed(1)+' pp':(d>0?'+':'')+(d/prev*100).toFixed(1)+'%';
  return `<span class="d ${cls}">${d>0?'▲':'▼'} ${txt}</span>`;
}
// v4: comparison basis for the whole view (mirrors getPriorAcct, returns a {markets} week-like object)
function getCmpWeek(w){
  if(w._prev)return {markets:w._prev};
  const cmpSel=document.getElementById('weekCompare');
  if(cmpSel&&cmpSel.value!=='prev')return WEEKS[parseInt(cmpSel.value)];
  if(wIdx<WEEKS.length-1)return WEEKS[wIdx+1];
  return null;
}
function chgLabel(){ // column header for the change column: WoW only when the comparison really is the prior week
  if(viewMode!=='WEEKLY')return 'MoM';
  const cmpSel=document.getElementById('weekCompare');
  return (!cmpSel||cmpSel.value==='prev')?'WoW':'Change';
}
function cmpLabelStr(w){

  const cmpSel=document.getElementById('weekCompare');
  if(cmpSel&&cmpSel.value!=='prev')return WEEKS[parseInt(cmpSel.value)].label;
  if(wIdx<WEEKS.length-1)return WEEKS[wIdx+1].label;
  return '—';
}

function usWeekNum(d){
  // US Sunday-start: week 1 is the Sun-Sat week containing Jan 1 (Excel WEEKNUM mode 1)
  const y=d.getUTCFullYear();
  const jan1=new Date(Date.UTC(y,0,1));
  const week1Start=new Date(jan1);
  week1Start.setUTCDate(jan1.getUTCDate()-jan1.getUTCDay());
  return Math.floor((d-week1Start)/86400000/7)+1;
}
function isoWeekNum(d){ // ISO 8601 week number (weeks start Monday, week 1 holds the first Thursday)
  const t=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate()));
  const day=(t.getUTCDay()+6)%7;t.setUTCDate(t.getUTCDate()-day+3);
  const firstThu=new Date(Date.UTC(t.getUTCFullYear(),0,4));
  return 1+Math.round(((t-firstThu)/86400000-3+((firstThu.getUTCDay()+6)%7))/7);
}
function weekLabelFor(w){
  const m=(w.fullLabel||'').match(/([A-Za-z]+)\s+(\d+),\s+(\d{4})/);
  if(!m) return w.label+' ('+w.range+')';
  const months={January:0,February:1,March:2,April:3,May:4,June:5,July:6,August:7,September:8,October:9,November:10,December:11};
  const weSun=new Date(Date.UTC(+m[3],months[m[1]],+m[2]));
  const mon=new Date(weSun);mon.setUTCDate(weSun.getUTCDate()-6);
  return 'WEEK '+isoWeekNum(mon)+' ('+w.range+')';
}
function renderWeekSelector(){
  const sel=document.getElementById('weekSelect');
  sel.innerHTML=WEEKS.map((w,i)=>`<option value="${i}"${i===wIdx?' selected':''}>${weekLabelFor(w)}</option>`).join('');
  const cmpSel=document.getElementById('weekCompare');
  if(viewMode!=='WEEKLY'){cmpSel.style.display='none';}
  else if(wIdx<WEEKS.length-1){
    cmpSel.innerHTML='<option value="prev">vs Prior Week</option>'+WEEKS.map((w,i)=>i!==wIdx?`<option value="${i}">${weekLabelFor(w)}</option>`:'').join('');
    cmpSel.style.display='';
  } else { cmpSel.style.display='none'; }
  document.getElementById('weekPrev').disabled=(wIdx>=WEEKS.length-1);
  document.getElementById('weekNext').disabled=(wIdx<=0);
}

const PACE_ORDER=['CC_US','CC_CA','CC_UK','CC_AUS','CC_DE','CC_FR','CC_ES','CC_IT','CC_NL','CC_SA','CL_US','PP_US'];
let paceMonth=null;
function paceFor(){
  if(!PACING||!PACING.length)return null;
  if(paceMonth){const f=PACING.find(p=>p.month===paceMonth);if(f)return f;}
  if(viewMode==='WEEKLY'&&wIdx===0||!WEEKS.length)return PACING[PACING.length-1];
  const ym=weekMonth(WEEKS[wIdx]);const key=ym.y+'-'+String(ym.m+1).padStart(2,'0');
  return PACING.find(p=>p.month===key)||PACING[PACING.length-1];
}
function paceCalc(P,tab){
  const [y,m]=P.month.split('-').map(Number);
  const dim=new Date(Date.UTC(y,m,0)).getUTCDate();
  const d=P.through?Math.min(dim,+P.through.slice(8,10)):0;
  const budget=P.budgets[tab], s=P.spend[tab], spend=s?s.spend:null;
  const target=budget!=null&&d?budget*d/dim:null;
  const pct=target&&spend!=null?spend/target*100:null;
  const proj=spend!=null&&d?spend/d*dim:null;
  const left=dim-d, need=budget!=null&&spend!=null&&left>0?Math.max(0,(budget-spend)/left):null;
  return {budget,spend,target,pct,proj,need,dim,d};
}
function paceCls(p){if(p==null)return '';const a=Math.abs(p-100);return a<=5?'pace-ok':a<=15?'pace-warn':'pace-crit';}
function paceCell(p){if(p==null)return '<span class="pace-none">no budget</span>';const c=paceCls(p);const w=Math.min(p,130)/1.3;
  return `<span class="${c}"><span class="pace-pct">${p.toFixed(1)}%</span><span class="pace-bar"><i style="width:${w}%"></i><b></b></span></span>`;}
function paceMonthLabel(P){const [y,m]=P.month.split('-').map(Number);return MONTH_NAMES[m-1]+' '+y;}
function pace7(P,t,c){ // last 7 days: the reporting week that ends on the pacing date, against 7 days of budget
  const w=WEEKS.find(x=>x.we===P.through);if(!w||c.budget==null)return {pct:null,spend:null};
  const a=w.markets[t]?.acct;if(!a)return {pct:null,spend:null};
  const tgt=c.budget/c.dim*7;return {pct:tgt?a.adSpend/tgt*100:null,spend:a.adSpend,tgt};
}
function renderPacing(tabs){
  const P=paceFor(); if(!P)return '';
  const rows=PACE_ORDER.filter(t=>tabs.indexOf(t)!==-1);
  if(!rows.length)return '';
  const any=rows.map(t=>paceCalc(P,t));const c0=any[0];
  const noBudget=!Object.keys(P.budgets||{}).length;
  const has7=!!WEEKS.find(x=>x.we===P.through);
  const sel=PACING.length>1?`<select class="pace-sel" onchange="paceMonth=this.value;render()">${PACING.map(p=>`<option value="${p.month}"${p.month===P.month?' selected':''}>${paceMonthLabel(p)}</option>`).join('')}</select>`:'';
  let h=`<div class="pace-head"><div class="sec">Ad Budget Pacing &middot; ${paceMonthLabel(P)}</div>${sel}<span class="pace-meta">${P.through?`spend through ${MONTH_NAMES[+P.month.slice(5)-1]} ${c0.d} &middot; ${c0.d} of ${c0.dim} days`:'no spend loaded yet'}</span></div>`;
  if(noBudget)h+=`<div class="pace-note" style="margin:0 0 10px;color:var(--amber)">${paceMonthLabel(P)} budgets are not in the budget sheet yet. Spend shows below; pacing appears once the client sets the month.</div>`;
  h+=`<div class="tbl-wrap"><table class="dt"><thead><tr><th>Channel</th><th>Monthly budget</th><th>Spend MTD</th><th>Target MTD</th><th style="text-align:left;padding-left:18px">Trending to goal</th>${has7?'<th style="text-align:left;padding-left:18px">Last 7 days</th>':''}<th>Projected month</th><th>Needed / day</th></tr></thead><tbody>`;
  let tb=0,ts=0,tt=0,tp=0,tn=0,t7=0,g7=0,hasB=false;
  rows.forEach(t=>{const c=paceCalc(P,t),cur=getCur(t),s7=pace7(P,t,c),st=stockTab(t);
    if(c.budget!=null&&c.spend!=null){hasB=true;tb+=toUSD(t,c.budget);ts+=toUSD(t,c.spend);tt+=toUSD(t,c.target||0);tp+=toUSD(t,c.proj||0);tn+=toUSD(t,c.need||0);if(s7.spend!=null){t7+=toUSD(t,s7.spend);g7+=toUSD(t,s7.tgt);}}
    const limited=st&&st.lost_usd>=1000&&c.pct!=null&&c.pct<85;  // real lost sales, not a stray long-tail SKU
    h+=`<tr class="clickable" onclick="switchMkt('${t}')"><td>${MKT_META[t]?.label||t}<span class="sub">${MKT_META[t]?.name||''}</span>${limited?`<span class="sub" style="color:var(--red)">stock-limited: ${st.out} out of stock</span>`:''}</td>`
      +`<td>${c.budget!=null?fCF(c.budget,cur):'<span class="pace-none">&mdash;</span>'}</td><td>${c.spend!=null?fCF(c.spend,cur):'<span class="pace-none">&mdash;</span>'}</td>`
      +`<td>${c.target!=null?fCF(c.target,cur):'&mdash;'}</td><td style="text-align:left;padding-left:18px">${paceCell(c.pct)}</td>`
      +(has7?`<td style="text-align:left;padding-left:18px" title="${s7.spend!=null?'Spent '+fCF(s7.spend,cur)+' in the week ending '+fDay(P.through)+' vs '+fCF(s7.tgt||0,cur)+' of weekly budget':''}">${paceCell(s7.pct)}</td>`:'')
      +`<td>${c.proj!=null?fCF(c.proj,cur):'&mdash;'}</td><td>${c.need!=null?fCF(c.need,cur):'&mdash;'}</td></tr>`;});
  if(rows.length>1&&hasB){const pct=tt?ts/tt*100:null;
    h+=`<tr class="pace-total"><td>Total<span class="sub">USD equivalent</span></td><td>${fCF(tb,'$')}</td><td>${fCF(ts,'$')}</td><td>${fCF(tt,'$')}</td><td style="text-align:left;padding-left:18px">${paceCell(pct)}</td>${has7?`<td style="text-align:left;padding-left:18px">${paceCell(g7?t7/g7*100:null)}</td>`:''}<td>${fCF(tp,'$')}</td><td>${fCF(tn,'$')}</td></tr>`;}
  h+=`</tbody></table></div><div class="pace-note">Trending to goal = spend to date &divide; (budget &times; days elapsed &divide; days in month), the sheet's column I. 100% = on pace to spend the full budget. Green within 5 points, amber within 15, red beyond. ${has7?'Last 7 days = the reporting week\'s spend &divide; 7 days of budget: where pacing is heading now. ':''}Stock-limited = under 85% while products out of stock have cost $1,000+ in lost sales (Inventory page), so more budget may not buy sales. Needed / day = what's left of the budget &divide; days left. Spend: Scale Insights (Cerakote Auto), Helium10 (Legacy, Prismatic, SA). Budgets: NIC_Monthly_Budgets sheet, ${P.source_tab?'"'+P.source_tab+'" tab':'tab not found yet'}.${(P.notes||[]).length?' '+P.notes.join(' '):''}</div>`;
  return h;
}


// ═══════════════════════════════════════════════════════════════
// WEEKLY BUDGET: Cerakote Auto rolling 6-week bucket from NIC. One USD ceiling across every Auto marketplace.
// Ceiling = NIC's week amount + last week's leftover (or minus its overspend), in full. Computed in scripts/weekly.py.
// ═══════════════════════════════════════════════════════════════
const WK_ORDER=['CC_US','CC_CA','CC_UK','CC_DE','CC_FR','CC_IT','CC_ES','CC_NL','CC_AUS','CC_SA'];
function fUSD(v){return v==null?'&mdash;':fCF(Math.round(v),'$');}
function wkSigned(v){if(v==null)return '&mdash;';if(Math.abs(v)<0.5)return '$0';return `<span class="${v<0?'wk-neg':'wk-pos'}">${v<0?'&minus;':'+'}${fCF(Math.round(Math.abs(v)),'$')}</span>`;}

function wkUsed(sp,ce){if(sp==null||!ce)return '<span class="pace-none">&mdash;</span>';const u=sp/ce*100;
  return `<span class="${u>100?'pace-crit':u>=90?'pace-warn':'pace-ok'}"><span class="pace-pct">${u.toFixed(0)}%</span><span class="pace-bar"><i style="width:${Math.min(u,130)/1.3}%"></i><b></b></span></span>`;}
function wkLoc(m,a){if(a.spend_local==null||a.cur==='USD')return '';return `<span class="sub">${fCF(Math.round(a.spend_local),getCur(m))} local</span>`;}
function renderWeeklyMarkets(w,tabs){
  const live=w.status==='current', daysLeft=7-w.days;
  const rows=WK_ORDER.filter(m=>w.alloc[m]&&tabs.indexOf(m)!==-1);
  let h=`<div class="sec" style="margin-top:4px">Wk ${w.wk} by marketplace <span class="sec-sub">${fDay(w.start)} &ndash; ${fDay(w.end)} &middot; USD</span></div><div class="tbl-wrap"><table class="dt"><thead><tr><th>Market</th><th>Weekly budget</th><th>Carried in</th><th>Ceiling</th><th>Spend</th><th style="text-align:left;padding-left:18px">Used</th><th>Left / over</th>${live?'<th>Room / day</th>':''}</tr></thead><tbody>`;
  let tb=0,tc=0,te=0,ts=0;
  rows.forEach(m=>{const a=w.alloc[m];tb+=a.base;tc+=a.carry_in;te+=a.ceiling;ts+=a.spend||0;
    const room=live&&a.left!=null&&daysLeft>0?Math.max(0,a.left)/daysLeft:null;
    h+=`<tr class="clickable" onclick="switchMkt('${m}')"><td>${MKT_META[m]?.label||m}<span class="sub">${MKT_META[m]?.name||''}</span></td><td>${fUSD(a.base)}</td><td>${w.wk===WEEKLY.weeks[0].wk?'<span class="pace-none">&mdash;</span>':wkSigned(a.carry_in)}</td><td>${fUSD(a.ceiling)}</td>`
      +`<td>${a.spend==null?'<span class="pace-none" style="color:var(--amber)">not loaded</span>':fUSD(a.spend)}${wkLoc(m,a)}</td><td style="text-align:left;padding-left:18px">${wkUsed(a.spend,a.ceiling)}</td><td>${a.left==null?'&mdash;':wkSigned(a.left)}</td>${live?`<td>${room==null?'&mdash;':fUSD(room)}</td>`:''}</tr>`;});
  if(rows.length>1)h+=`<tr class="pace-total"><td>Total</td><td>${fUSD(tb)}</td><td>${w.wk===WEEKLY.weeks[0].wk?'':wkSigned(tc)}</td><td>${fUSD(te)}</td><td>${fUSD(ts)}</td><td style="text-align:left;padding-left:18px">${wkUsed(ts,te)}</td><td>${wkSigned(te-ts)}</td>${live?`<td>${daysLeft>0?fUSD(Math.max(0,te-ts)/daysLeft):'&mdash;'}</td>`:''}</tr>`;
  h+=`</tbody></table></div><div class="pace-note">${WEEKLY.alloc_note||''} Each market carries its own leftover or overspend into its next week.</div><div class="sec">6-week schedule &middot; all Auto markets</div>`;
  return h;
}
function renderWeeklyMkt(m){
  if(!WEEKLY||!WEEKLY.weeks||!m.startsWith('CC_')||!WEEKLY.weeks[0].alloc||!WEEKLY.weeks[0].alloc[m])return '';
  const W=WEEKLY.weeks, cur=W.find(w=>w.status==='current');
  let h=`<div class="pace-head"><div class="sec">Weekly Ad Budget &middot; ${MKT_META[m]?.label||m}</div><span class="pace-meta">share of NIC's rolling 6-week Cerakote Auto budget &middot; USD${WEEKLY.through?' &middot; spend through '+fDay(WEEKLY.through):''}</span></div>`;
  if(cur&&cur.alloc[m]){const a=cur.alloc[m],dl=7-cur.days,pct=a.spend!=null&&cur.days?a.spend/(a.ceiling*cur.days/7)*100:null;
    h+=`<div class="kpi-row wk-kpi" style="margin-bottom:14px">${[
      ['neutral',`Wk ${cur.wk} ceiling`,fUSD(a.ceiling),`${fUSD(a.base)} budget ${a.carry_in>=0?'+':'&minus;'} ${fUSD(Math.abs(a.carry_in))} carried`],
      ['neutral','Spent this week',a.spend==null?'&mdash;':fUSD(a.spend),a.spend_local!=null&&a.cur!=='USD'?fCF(Math.round(a.spend_local),getCur(m))+' local &middot; '+cur.days+' of 7 days':cur.days+' of 7 days'],
      [a.left!=null&&a.left<0?'crit':'ok','Left this week',a.left==null?'&mdash;':(a.left<0?'&minus;'+fUSD(-a.left):fUSD(a.left)),a.left!=null&&dl>0?fUSD(Math.max(0,a.left)/dl)+' / day for '+dl+' days':''],
      [pct==null?'neutral':pct>100?'warn':'ok','Pace vs ceiling',pct==null?'&mdash;':pct.toFixed(0)+'%','spend &divide; ceiling to date'],
    ].map(([s,l,v,sub])=>`<div class="kpi ${s}"><div class="kpi-lbl">${l}</div><div class="kpi-val ${s==='crit'?'crit':s==='warn'?'warn':''}">${v}</div><div class="kpi-sub"><span class="sub-lbl">${sub}</span></div></div>`).join('')}</div>`;}
  h+=`<div class="tbl-wrap"><table class="dt"><thead><tr><th>Week</th><th>Dates</th><th>Budget</th><th>Carried in</th><th>Ceiling</th><th>Spend</th><th style="text-align:left;padding-left:18px">Used</th><th>Left / over</th><th>Status</th></tr></thead><tbody>`;
  W.forEach((w,i)=>{const a=w.alloc[m],prev=W[i-1];
    const carry=i===0?'<span class="pace-none">&mdash;</span>':(prev&&(prev.status==='locked'||prev.status==='provisional')&&prev.days===7)?wkSigned(a.carry_in):'<span class="pace-none">pending</span>';
    const st=w.status==='current'?`in progress &middot; ${w.days}/7 days`:w.status==='provisional'?`provisional &middot; locks ${fDay(w.lock_date)}`:w.status;
    h+=`<tr class="${w.status==='current'?'wk-now':''}"><td>Wk ${w.wk}</td><td>${fDay(w.start)} &ndash; ${fDay(w.end)}</td><td>${fUSD(a.base)}</td><td>${carry}</td><td>${fUSD(a.ceiling)}</td><td>${a.spend==null?'&mdash;':fUSD(a.spend)}${wkLoc(m,a)}</td><td style="text-align:left;padding-left:18px">${w.days?wkUsed(a.spend,a.ceiling):'<span class="pace-none">&mdash;</span>'}</td><td>${a.left==null?'&mdash;':wkSigned(a.left)}</td><td><span class="wk-st ${w.status}">${st}</span></td></tr>`;});
  h+=`</tbody></table></div><div class="pace-note">${WEEKLY.alloc_note||''} This market's leftover or overspend carries into its own next week. The ceiling is a cap, not a target. Spend converts to USD at each day's rate.</div>`;
  return h;
}

function renderWeekly(tabs){
  if(!WEEKLY||!WEEKLY.weeks||!tabs.some(t=>t.startsWith('CC_')))return '';
  const W=WEEKLY.weeks, cur=W.find(w=>w.status==='current');
  const last=[...W].reverse().find(w=>w.status==='locked'||w.status==='provisional');
  let meta=WEEKLY.through?`spend through ${fDay(WEEKLY.through)}`:'no spend loaded yet';
  let h=`<div class="pace-head"><div class="sec">Weekly Ad Budget &middot; Cerakote Auto</div><span class="pace-meta">rolling 6 weeks from NIC &middot; ${meta}</span></div>`;
  if(cur&&cur.spend!=null){const daysLeft=7-cur.days, need=daysLeft>0?Math.max(0,cur.left)/daysLeft:null, pct=cur.days?cur.spend/(cur.ceiling*cur.days/7)*100:null;
    h+=`<div class="kpi-row wk-kpi" style="margin-bottom:14px">${[
      ['neutral',`Wk ${cur.wk} ceiling`,fUSD(cur.ceiling),`${fUSD(cur.base)} NIC ${cur.carry_in>=0?'+':'&minus;'} ${fUSD(Math.abs(cur.carry_in))} carried`],
      ['neutral','Spent this week',fUSD(cur.spend),`${cur.days} of 7 days`],
      [cur.left<0?'crit':'ok','Left this week',cur.left<0?'&minus;'+fUSD(-cur.left):fUSD(cur.left),need!=null?`${fUSD(need)} / day for ${daysLeft} days`:'week complete'],
      [pct==null?'neutral':pct>100?'warn':'ok','Pace vs ceiling',pct==null?'&mdash;':pct.toFixed(0)+'%','spend &divide; ceiling to date'],
    ].map(([s,l,v,sub])=>`<div class="kpi ${s}"><div class="kpi-lbl">${l}</div><div class="kpi-val ${s==='crit'?'crit':s==='warn'?'warn':''}">${v}</div><div class="kpi-sub"><span class="sub-lbl">${sub}</span></div></div>`).join('')}</div>`;}
  h+='<!--WKMKT-->';
  h+=`<div class="tbl-wrap"><table class="dt"><thead><tr><th>Week</th><th>Dates</th><th>NIC budget</th><th>Carried in</th><th>Ceiling</th><th>Spend</th><th style="text-align:left;padding-left:18px">Used</th><th>Left / over</th><th>Status</th></tr></thead><tbody>`;
  W.forEach((w,i)=>{const prev=W[i-1];
    const carry=i===0?'<span class="pace-none">in NIC figure</span>':(prev&&(prev.status==='locked'||prev.status==='provisional')&&prev.days===7)?wkSigned(w.carry_in):'<span class="pace-none">pending</span>';
    const used=w.spend!=null&&w.days?w.spend/w.ceiling*100:null;
    const st=w.status==='current'?`in progress &middot; ${w.days}/7 days`:w.status==='provisional'?`provisional &middot; locks ${fDay(w.lock_date)}`:w.status;
    h+=`<tr class="${w.status==='current'?'wk-now':''}"><td>Wk ${w.wk}</td><td>${fDay(w.start)} &ndash; ${fDay(w.end)}</td><td>${fUSD(w.base)}</td><td>${carry}</td><td>${fUSD(w.ceiling)}</td>`
      +`<td>${w.days?fUSD(w.spend):'&mdash;'}</td><td style="text-align:left;padding-left:18px">${used==null?'<span class="pace-none">&mdash;</span>':`<span class="${used>100?'pace-crit':used>=90?'pace-warn':'pace-ok'}"><span class="pace-pct">${used.toFixed(0)}%</span><span class="pace-bar"><i style="width:${Math.min(used,130)/1.3}%"></i><b></b></span></span>`}</td>`
      +`<td>${w.days?wkSigned(w.left):'&mdash;'}</td><td><span class="wk-st ${w.status}">${st}</span></td></tr>`;});
  const sumB=W.reduce((s,w)=>s+w.base,0);
  h+=`<tr class="pace-total"><td>6 weeks</td><td>${fDay(W[0].start)} &ndash; ${fDay(W[W.length-1].end)}</td><td>${fUSD(sumB)}</td><td></td><td></td><td>${fUSD(W.reduce((s,w)=>s+(w.spend||0),0))}</td><td></td><td></td><td></td></tr></tbody></table></div>`;
  const split=cur||last;
  if(split&&split.alloc)h=h.replace('<!--WKMKT-->',renderWeeklyMarkets(split,tabs));
  const end=W[W.length-1], nicDue=end&&new Date(end.start)<=new Date(WEEKLY.built);
  h+=`<div class="pace-note"${split&&split.markets?' style="margin-top:0"':''}>${nicDue?'<span style="color:var(--amber)">Last week of this schedule: ask NIC for the next six weeks. </span>':''}The ceiling is a cap, not a target. Ceiling = NIC's week amount + last week's leftover, or minus last week's overspend, in full. A finished week locks the Tuesday after it ends; until then its carryover is provisional (Thursday re-pulls settle attribution). Cerakote Auto only, every marketplace pooled, SP + SB + SD; Legacy, Prismatic and DSP are outside it. Non-USD spend converts at each day's rate (ECB via frankfurter.dev; weekends use Friday's). Spend: Scale Insights (SA: Helium10). Budget: ${WEEKLY.source||'NIC'}.${(WEEKLY.notes||[]).length?' '+WEEKLY.notes.join(' '):''}</div>`;
  return h;
}

}

function renderMktView(){
  const w=getActiveWeek(), d=getMktData(w,mktKey);
  const cur=getCur(mktKey);
  const prods=d.products||[];
  let html=renderWeeklyMkt(mktKey)+renderPacing([mktKey]);

  if(prods.length){
    html+=`<div class="sec">Revenue & Advertising Mix</div><div class="three-col">
      <div class="panel"><div class="panel-header"><span class="panel-title">Revenue by Product</span></div><div class="panel-body"><div class="chart-wrap tall"><canvas id="cRevenue"></canvas></div></div></div>
      <div class="panel"><div class="panel-header"><span class="panel-title">Organic vs Ad-Driven</span></div><div class="panel-body"><div class="chart-wrap tall"><canvas id="cOrganic"></canvas></div></div></div>
      <div class="panel"><div class="panel-header"><span class="panel-title">TACoS by Product</span><span class="badge badge-info" style="font-size:8px">10% target</span></div><div class="panel-body"><div class="chart-wrap tall"><canvas id="cTacos"></canvas></div></div></div>
    </div>`;

    const cmpW=getCmpWeek(w); let pm={};
    if(cmpW){(getMktData(cmpW,mktKey).products||[]).forEach(pp=>pm[pp.name]=pp);}
    const cs=cmpLabelStr(w);
    html+=`<div class="sec">Product Performance</div><div class="tbl-wrap"><table class="dt"><thead><tr><th>Product</th><th>Rev ${cs}</th><th>Rev ${w.label}</th><th>${chgLabel()}</th><th>Units</th><th>Sessions</th><th>CVR</th><th>Ad Spend</th><th>Ad Sales</th><th>Organic</th><th>TACoS</th><th>ACoS</th><th>NTB</th><th>Cat BSR</th></tr></thead><tbody>`;
    prods.forEach(p=>{
      const pp=pm[p.name];
      const ts=(p.acos>30||p.tacos>15)?'crit':p.tacos>10?'warn':'ok';
      const org=p.organic!=null?p.organic:((p.revenue||0)-(p.adSales||0));
      const porg=pp?(pp.organic!=null?pp.organic:((pp.revenue||0)-(pp.adSales||0))):null;
      const bsr=(p.categoryBSR||p.bsr);
      const pbsr=pp?(pp.categoryBSR||pp.bsr):null;
      const oo=oosProduct(mktKey,p.name);
      html+=`<tr><td>${esc(p.name)}${oo?`<span class="oos-chip${oo.main?'':' var'}" title="${esc(oo.name)} (${oo.asin}): ${oo.hold?'listing on hold':'out of stock'} since ${fDay(oo.since)}, est. $${fN(oo.lost_usd)} lost so far">${oo.main?(oo.hold?'HOLD':'OUT'):'A variant out'} since ${fDay(oo.since)}</span>`:''}${p.subcategory?`<span class="sub">${esc(p.subcategory)}</span>`:''}</td><td>${pp?fCF(pp.revenue||0,cur):'\u2014'}</td><td>${fCF(p.revenue||0,cur)}</td><td>${dd(p.revenue,pp&&pp.revenue)}</td><td>${fN(p.units||0)} ${dd(p.units,pp&&pp.units)}</td><td>${fN(p.sessions||0)} ${dd(p.sessions,pp&&pp.sessions)}</td><td>${fP(p.cvr||0)} ${dd(p.cvr,pp&&pp.cvr,true)}</td><td>${fCF(p.adSpend||0,cur)} ${dd(p.adSpend,pp&&pp.adSpend,false,true)}</td><td>${fCF(p.adSales||0,cur)} ${dd(p.adSales,pp&&pp.adSales)}</td><td>${fCF(Math.round(org),cur)} ${dd(org,porg)}</td><td><span class="pill ${ts}">${fP(p.tacos||0)}</span> ${dd(p.tacos,pp&&pp.tacos,true,true)}</td><td>${fP(p.acos||0)} ${dd(p.acos,pp&&pp.acos,true,true)}</td><td>${ntbCell(ntbState(w,mktKey),fN(p.ntbOrders||0)+' '+dd(p.ntbOrders,pp&&pp.ntbOrders))}</td><td>${bsr?'#'+bsr:'\u2014'}${p.subcategoryBSR?` <span class="sub" style="display:inline;color:var(--accent)">(#${p.subcategoryBSR})</span>`:''} ${bsr&&pbsr?dd(bsr,pbsr,false,true):''}</td></tr>`;
    });
    html+='</tbody></table></div>';
  } else {
    html+='<div class="sec" style="color:var(--muted);margin:40px 0">Account-level data only. No product breakdown available for this marketplace.</div>';
  }
  const st=stockTab(mktKey);
  if(st&&st.items.length){
    html+=`<div class="sec">Out of stock now <span class="sec-sub">from the Inventory page, ${esc(STOCK.week)} · <a href="../inventory/">open</a></span></div><div class="tbl-wrap"><table class="dt"><thead><tr><th>Product</th><th>Out since</th><th>Days</th><th>Lost so far</th><th>Inbound</th></tr></thead><tbody>`
      +st.items.slice(0,8).map(i=>`<tr><td>${esc(i.name)}<span class="sub">${i.asin}${i.pool?' · '+esc(i.pool)+' pool':''}${i.hold?' · listing on hold':''}</span></td><td>${fDay(i.since)}</td><td>${i.days??'?'}</td><td>${i.hold?'<span class="pace-none">hold</span>':'$'+fN(i.lost_usd)}</td><td>${i.inbound?fN(i.inbound):'<span class="pace-none">none</span>'}</td></tr>`).join('')
      +`</tbody></table></div>`;
  }
  if(WEEKS.length>1&&w===WEEKS[wIdx])html+=`<div class="sec">Weekly trend <span class="sec-sub">revenue, TACoS${(CHANGES.weeks&&Object.keys(CHANGES.weeks).length)?', and weeks with big ad changes (dashed)':''}</span></div><div class="panel" style="margin-bottom:24px"><div class="panel-body"><div class="chart-wrap tall"><canvas id="mTrend"></canvas></div></div></div>`;
  if((d.flags||[]).length)html+=`<div class="sec">Data notes</div><ul class="data-notes">${d.flags.map(f=>`<li>${esc(f)}</li>`).join('')}</ul>`;

  document.getElementById('mainContent').innerHTML=html;
}

function destroyAll(){Object.values(CH).forEach(c=>{try{c.destroy();}catch(e){}});CH={};}
function mkChart(id,cfg){const el=document.getElementById(id);if(el)CH[id]=new Chart(el,cfg);}

const chartDefaults={responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{color:'#262626'},ticks:{color:'#a3a3a3',font:{size:10}}},y:{grid:{color:'#262626'},ticks:{color:'#a3a3a3'}}}};

function buildGlobalCharts(){
  const w=getActiveWeek();
  const mks=filterMkts(Object.keys(w.markets));
  const labels=mks.map(k=>MKT_META[k]?.label||k);
  const revs=mks.map(k=>toUSD(k,w.markets[k]?.acct.revenue||0));
  const orgs=mks.map(k=>toUSD(k,w.markets[k]?.acct.organicSales||0));
  const adsales=mks.map(k=>toUSD(k,w.markets[k]?.acct.adSales||0));
  const tacs=mks.map(k=>w.markets[k]?.acct.tacos||0);
  const cols=mks.map(k=>(MKT_COLORS_LIGHT[k]||'#a3a3a3'));

  mkChart('gRevMkt',{type:'bar',data:{labels,datasets:[{data:revs,backgroundColor:cols.map(c=>c+'25'),borderColor:cols,borderWidth:1.5,borderRadius:4}]},options:{...chartDefaults,scales:{x:chartDefaults.scales.x,y:{...chartDefaults.scales.y,ticks:{callback:v=>'$'+(v/1000).toFixed(0)+'k',color:'#a3a3a3',font:{size:9}}}}}});

  mkChart('gTacosMkt',{type:'bar',data:{labels,datasets:[{label:'TACoS',data:tacs,backgroundColor:tacs.map(v=>v>15?'#dc262620':v>10?'#ff980020':'#10b98125'),borderColor:tacs.map(v=>v>15?'#ef4444':v>10?'#ff9800':'#10b981'),borderWidth:1.5,borderRadius:4},{label:'10% Target',data:new Array(mks.length).fill(10),type:'line',borderColor:'#3a3a3a',borderDash:[4,4],borderWidth:1,pointRadius:0,fill:false}]},options:{...chartDefaults,plugins:{legend:{position:'bottom',labels:{boxWidth:8,padding:10,font:{size:9},color:'#a3a3a3'}}},scales:{x:chartDefaults.scales.x,y:{...chartDefaults.scales.y,ticks:{callback:v=>v+'%',color:'#a3a3a3',font:{size:9}}}}}});

  mkChart('gOrgMkt',{type:'bar',data:{labels,datasets:[{label:'Organic',data:orgs,backgroundColor:'#10b98125',borderColor:'#10b981',borderWidth:1},{label:'Ad Sales',data:adsales,backgroundColor:'#ff980018',borderColor:'#ff9800',borderWidth:1}]},options:{...chartDefaults,plugins:{legend:{position:'bottom',labels:{boxWidth:8,padding:10,font:{size:9},color:'#a3a3a3'}}},scales:{x:{stacked:true,grid:{color:'#262626'},ticks:{color:'#a3a3a3',font:{size:10}}},y:{stacked:true,grid:{color:'#262626'},ticks:{callback:v=>'$'+(v/1000).toFixed(0)+'k',color:'#a3a3a3',font:{size:9}}}}}});

  if(WEEKS.length>1&&document.getElementById('gRevTrend')){
    const wLabels=WEEKS.map(w=>w.label).reverse();
    const trendRevs=WEEKS.map(w=>getGlobalAcct(w).revenue).reverse();
    const trendTacos=WEEKS.map(w=>getGlobalAcct(w).tacos).reverse();

    const gwe=WEEKS.map(w=>w.we).reverse(),gcw=changeWeeks('GLOBAL');
    mkChart('gRevTrend',{type:'line',plugins:[changeMarkers],data:{labels:wLabels,datasets:[{data:trendRevs,borderColor:'#ff9800',backgroundColor:'#ff980010',fill:true,tension:0.3,pointRadius:3,pointBackgroundColor:'#ff9800',borderWidth:2}]},options:{...chartDefaults,plugins:{legend:{display:false},changeMarkers:{idx:markerIdx(gwe,gcw)},tooltip:{callbacks:{footer:changeFooter(gcw,gwe)}}},scales:{x:{grid:{color:'#262626'},ticks:{color:'#a3a3a3',font:{size:9},maxRotation:45}},y:{...chartDefaults.scales.y,ticks:{callback:v=>'$'+(v/1000).toFixed(0)+'k',color:'#a3a3a3',font:{size:9}}}}}});

    mkChart('gTacosTrend',{type:'line',data:{labels:wLabels,datasets:[{data:trendTacos,borderColor:'#ff9800',segment:{borderColor:ctx=>{const v=ctx.p1.parsed.y;return v>15?'#ef4444':v>10?'#ff9800':'#10b981';}},backgroundColor:'#ff980008',fill:true,tension:0.3,pointRadius:3,pointBackgroundColor:trendTacos.map(v=>v>15?'#ef4444':v>10?'#ff9800':'#10b981'),borderWidth:2},{label:'10% Target',data:new Array(wLabels.length).fill(10),borderColor:'#3a3a3a',borderDash:[4,4],borderWidth:1,pointRadius:0,fill:false}]},options:{...chartDefaults,plugins:{legend:{display:false}},scales:{x:{grid:{color:'#262626'},ticks:{color:'#a3a3a3',font:{size:9},maxRotation:45}},y:{...chartDefaults.scales.y,ticks:{callback:v=>v+'%',color:'#a3a3a3',font:{size:9}}}}}});
  }
}

// ---- ad-change markers: weeks where Scale Insights logged a budget change, or manual edits well above that market's norm
function changeWeeks(tab){ // -> {we: {manual, automation, budget}} for tab ('GLOBAL' sums all)
  const out={};if(!CHANGES||!CHANGES.weeks)return out;
  Object.keys(CHANGES.weeks).forEach(we=>{const m=CHANGES.weeks[we];let a=0,b=0,n=false;
    Object.keys(m).forEach(t=>{if(tab!=='GLOBAL'&&t!==tab)return;n=true;a+=m[t].manual||0;b+=m[t].automation||0;});if(n)out[we]={manual:a,automation:b,budget:0};});
  Object.keys(CHANGES.budget_changes||{}).forEach(t=>{if(tab!=='GLOBAL'&&t!==tab)return;(CHANGES.budget_changes[t]||[]).forEach(c=>{(out[c.we]=out[c.we]||{manual:0,automation:0,budget:0}).budget++;});});
  return out;
}
function markerIdx(labelsWe,cw){ // indexes of weeks to mark
  const ms=Object.values(cw).map(x=>x.manual).filter(x=>x>0).sort((a,b)=>a-b);const med=ms.length?ms[Math.floor(ms.length/2)]:0;
  return labelsWe.map((we,i)=>{const c=cw[we];return c&&(c.budget>0||(c.manual>=50&&c.manual>=2*med))?i:-1;}).filter(i=>i>=0);
}
const changeMarkers={id:'changeMarkers',afterDatasetsDraw(chart,args,opts){
  if(!opts||!opts.idx||!opts.idx.length)return;const {ctx,chartArea,scales}=chart;ctx.save();
  opts.idx.forEach(i=>{const x=scales.x.getPixelForValue(i);ctx.strokeStyle='rgba(250,204,21,0.6)';ctx.setLineDash([3,3]);ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(x,chartArea.top);ctx.lineTo(x,chartArea.bottom);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#facc15';ctx.font='600 9px "JetBrains Mono",monospace';ctx.fillText('changes',x+3,chartArea.top+10);});
  ctx.restore();}};
function changeFooter(cw,labelsWe){return items=>{const c=cw[labelsWe[items[0].dataIndex]];if(!c)return '';
  return 'Ad changes logged in Scale Insights: '+c.manual+' manual, '+c.automation+' rule'+(c.budget?', '+c.budget+' budget':'');};}
function buildMktTrend(){
  const el=document.getElementById('mTrend');if(!el)return;
  const ws=WEEKS.slice().reverse(),cur=getCur(mktKey);
  const labels=ws.map(w=>w.label),we=ws.map(w=>w.we);
  const rev=ws.map(w=>w.markets[mktKey]?.acct.revenue||0),tac=ws.map(w=>w.markets[mktKey]?.acct.tacos||0);
  const cw=changeWeeks(mktKey);
  mkChart('mTrend',{type:'bar',plugins:[changeMarkers],data:{labels,datasets:[
    {type:'bar',label:'Revenue',data:rev,backgroundColor:'#ff980030',borderColor:'#ff9800',borderWidth:1,borderRadius:3,yAxisID:'y'},
    {type:'line',label:'TACoS %',data:tac,borderColor:'#10b981',backgroundColor:'#10b981',pointRadius:2,tension:0.3,yAxisID:'y1'}]},
    options:{...chartDefaults,plugins:{legend:{display:true,position:'bottom',labels:{boxWidth:8,padding:10,font:{size:9},color:'#a3a3a3'}},changeMarkers:{idx:markerIdx(we,cw)},tooltip:{callbacks:{footer:changeFooter(cw,we)}}},
      scales:{x:{grid:{color:'#262626'},ticks:{color:'#a3a3a3',font:{size:9},maxRotation:45}},y:{grid:{color:'#262626'},ticks:{color:'#a3a3a3',font:{size:9},callback:v=>cur+(v>=1000?(v/1000).toFixed(0)+'k':v)}},
        y1:{position:'right',grid:{display:false},ticks:{color:'#10b981',font:{size:9},callback:v=>v+'%'}}}}});
}
function buildMktCharts(){
  buildMktTrend();
  const d=getMktData(getActiveWeek(),mktKey);
  const prods=d.products||[];
  if(!prods.length)return;
  const pn=prods.map(p=>p.name.length>14?p.name.substring(0,12)+'..':p.name);
  const cur=getCur(mktKey);
  const revs=prods.map(p=>p.revenue);
  const ads=prods.map(p=>p.adSales);
  const org=prods.map(p=>Math.max(0,(p.organic||0)));
  const tacs=prods.map(p=>p.tacos);
  const cols=prods.map((_,i)=>PC_COLORS[i%PC_COLORS.length]);

  mkChart('cRevenue',{type:'bar',data:{labels:pn,datasets:[{data:revs,backgroundColor:cols.map(c=>c+'20'),borderColor:cols,borderWidth:1.5,borderRadius:3}]},options:{...chartDefaults,scales:{x:chartDefaults.scales.x,y:{...chartDefaults.scales.y,ticks:{callback:v=>cur+(v/1000).toFixed(0)+'k',color:'#a3a3a3',font:{size:9}}}}}});

  mkChart('cOrganic',{type:'bar',data:{labels:pn,datasets:[{label:'Organic',data:org,backgroundColor:'#10b98122',borderColor:'#10b981',borderWidth:1},{label:'Ad Sales',data:ads,backgroundColor:'#ff980015',borderColor:'#ff9800',borderWidth:1}]},options:{...chartDefaults,plugins:{legend:{position:'bottom',labels:{boxWidth:8,padding:10,font:{size:9},color:'#a3a3a3'}}},scales:{x:{stacked:true,grid:{color:'#262626'},ticks:{color:'#a3a3a3',font:{size:9}}},y:{stacked:true,grid:{color:'#262626'},ticks:{callback:v=>cur+(v/1000).toFixed(0)+'k',color:'#a3a3a3',font:{size:9}}}}}});

  mkChart('cTacos',{type:'bar',data:{labels:pn,datasets:[{label:'TACoS',data:tacs,backgroundColor:tacs.map(v=>v>15?'#dc262620':v>10?'#ff980020':'#10b98125'),borderColor:tacs.map(v=>v>15?'#ef4444':v>10?'#ff9800':'#10b981'),borderWidth:1.5,borderRadius:3},{label:'10% Target',data:new Array(prods.length).fill(10),type:'line',borderColor:'#3a3a3a',borderDash:[4,4],borderWidth:1,pointRadius:0,fill:false}]},options:{...chartDefaults,plugins:{legend:{position:'bottom',labels:{boxWidth:8,padding:10,font:{size:9},color:'#a3a3a3'}}},scales:{x:chartDefaults.scales.x,y:{...chartDefaults.scales.y,ticks:{callback:v=>v+'%',color:'#a3a3a3',font:{size:9}}}}}});
}

function renderPeriodHead(){
  const el=document.getElementById('periodHead');if(!el)return;
  const w=getActiveWeek();
  const cmp=w._prev?(w.range||''):('vs '+cmpLabelStr(w));
  let pre='';
  if(viewMode==='WEEKLY'&&w.generated_at){ // built before the Thursday re-pull: sessions, ad attribution and NTB still move
    const thu=new Date(weSunday(w));thu.setUTCDate(thu.getUTCDate()+4);thu.setUTCHours(12);
    if(new Date(w.generated_at)<thu)pre='<div class="prelim">Preliminary: Monday pull. Sessions, ad attribution and NTB settle in Thursday\'s re-pull.</div>';
  }
  el.innerHTML=`<h1>${w.label} <span>${cmp}</span></h1><div class="sub">${w.fullLabel}</div>${pre}`;
}
function render(){
  if(WEEKS.length===0){document.getElementById('mainContent').innerHTML='<div class="sec" style="margin:60px 0;text-align:center">No data loaded yet.</div>';return;}
  renderHeader();renderMktTabs();renderWeekSelector();renderFilterBar();renderPeriodHead();renderKPIs();
  destroyAll();
  if(mktKey==='GLOBAL'){renderGlobalView();requestAnimationFrame(()=>buildGlobalCharts());}
  else{renderMktView();requestAnimationFrame(()=>buildMktCharts());}
  const aw=getActiveWeek();
  document.getElementById('footWeek').textContent=aw.fullLabel;
  document.getElementById('footMkt').textContent=(MKT_META[mktKey]?.name||mktKey).replace(/\s*\(All Markets\)/i,'');
}

function switchMkt(mk){mktKey=mk;render();}
function switchWeek(i){wIdx=parseInt(i);render();}
function weekPrev(){if(wIdx<WEEKS.length-1){wIdx++;render();}}
function weekNext(){if(wIdx>0){wIdx--;render();}}
function setBrand(b){brandFilter=b;render();}
function setView(v){viewMode=v;render();}

function renderFilterBar(){
  const fb=document.getElementById('filterBar');
  if(!fb)return;
  fb.innerHTML=`
    <div class="filter-group"><span class="filter-label">View</span>
      <button class="filter-btn ${viewMode==='WEEKLY'?'active':''}" onclick="setView('WEEKLY')">WEEKLY</button>
      <button class="filter-btn ${viewMode==='MONTH'?'active':''}" onclick="setView('MONTH')">MONTH</button>
    </div>
    <div class="filter-group"><span class="filter-label">Brands</span>
      <button class="filter-btn ${brandFilter==='ALL'?'active':''}" onclick="setBrand('ALL')">ALL BRANDS</button>
      <button class="filter-btn ${brandFilter==='CC'?'active':''}" onclick="setBrand('CC')">CERAMICS ONLY</button>
      <button class="filter-btn ${brandFilter==='EU'?'active':''}" onclick="setBrand('EU')">EU</button>
    </div>`;
}

window.addEventListener('load',()=>render());
